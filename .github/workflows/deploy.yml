name: Deploy

# Deploy a Cloudflare al hacer push a main, o manualmente desde Actions.
#
# Configurar antes del primer run (Settings → Secrets and variables → Actions):
#   Secrets   → CLOUDFLARE_API_TOKEN   (permisos: Workers Scripts:Edit, Cloudflare Pages:Edit)
#   Variables → CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard → barra lateral derecha)
#   Variables → VITE_API               (URL pública del Worker; se llena tras el primer deploy de la API)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-api:
    name: Deploy API (Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run deploy
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy Web (Pages)
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run deploy
        working-directory: web
        env:
          VITE_API: ${{ vars.VITE_API }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
