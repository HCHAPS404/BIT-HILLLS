<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAREA · SAT de inundación · Cartagena</title>
    <meta name="description" content="Sistema de alerta temprana de inundación para el corredor turístico de Cartagena, con valor económico expuesto por zona." />
  </head>
  <body>
    <div id="root"></div>
    <!--
      El modo se aplica ANTES del primer pintado. Si esperáramos al useEffect
      de React, la página pintaría un fotograma en modo noche antes de saltar
      a día: el clásico destello blanco/negro al cargar.
    -->
    <script>
      try {
        document.documentElement.setAttribute(
          'data-tema',
          localStorage.getItem('marea:tema') === 'dia' ? 'dia' : 'noche',
        );
      } catch (e) {
        document.documentElement.setAttribute('data-tema', 'noche');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
